name: Build and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Plan only, or plan and apply the saved plan
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -lockfile=readonly
      - run: terraform validate

  production:
    needs: [validate, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: terraform-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: e1a4ae50-f5fd-41de-80c8-3159e6b0da84
      ARM_SUBSCRIPTION_ID: f90ff751-313f-4e7a-a475-8d252d80c41a
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_USE_CLI: "false"
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_VAR_budget_alert_emails: '["ayhuntekat@gmail.com","sevgikafalii@gmail.com"]'
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build frontend
        working-directory: .
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm build
      - name: Check environment configuration
        run: |
          test -n "$ARM_TENANT_ID" || { echo '::error::Set production variable AZURE_TENANT_ID'; exit 1; }
          test -n "$TF_STATE_STORAGE_ACCOUNT" || { echo '::error::Set production variable TF_STATE_STORAGE_ACCOUNT'; exit 1; }
      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
      - name: Ensure Terraform state storage and blob role exist
        run: bash ../scripts/ensure-state-storage.sh
      - name: Check hosting resource provider
        run: |
          registration=$(az provider show --namespace Microsoft.Web --query registrationState -o tsv)
          if [ "$registration" != "Registered" ]; then
            echo '::error::An Azure subscription administrator must register Microsoft.Web before hosting can deploy: az provider register --namespace Microsoft.Web --wait'
            exit 1
          fi
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - name: Initialize remote state with OIDC
        run: terraform init -lockfile=readonly -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT"
      - name: Create plan
        run: terraform plan -lock-timeout=5m -out=production.tfplan
      - name: Apply saved plan
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'apply')
        run: terraform apply -lock-timeout=5m production.tfplan
      - name: Retrieve deployment token using Azure OIDC login
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'apply')
        id: deployment-token
        run: |
          token=$(az staticwebapp secrets list --name sevgi-qr --resource-group sevgi-qr --query properties.apiKey -o tsv)
          test -n "$token" || { echo '::error::Azure returned an empty deployment token'; exit 1; }
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Deploy QR Studio
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'apply')
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.deployment-token.outputs.token }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          skip_api_build: false
          api_location: api
          production_branch: main
      - name: Show hosting endpoint and DNS target
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'apply')
        run: |
          {
            echo '## QR hosting provisioned'
            echo "Azure URL: $(terraform output -raw static_web_app_url)"
            echo ''
            echo "Custom URL: $(terraform output -raw qr_url)"
            echo "DNS: keep the DNS-only CNAME named qr under sgkafali.com pointing to $(terraform output -raw qr_domain_cname_target)."
            echo ''
            echo 'QR Studio deployed. Azure manages the custom-domain HTTPS certificate.'
          } >> "$GITHUB_STEP_SUMMARY"
